name: Feature request
description: Propose an improvement within Arpticuno's authorized-LAN scope
title: "feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, output, or API behavior.
    validations:
      required: true
  - type: textarea
    id: safeguards
    attributes:
      label: Safety and scope impact
      description: Explain how private/link-local restrictions, resource limits, and authorization remain intact.
    validations:
      required: true
