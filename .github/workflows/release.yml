name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Install the locked environment
        run: uv sync --locked --all-extras --python 3.12

      - name: Verify tag and package versions match
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(uv run --no-sync python -c 'import arpticuno; print(arpticuno.__version__)')"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"

      - name: Validate release
        run: |
          uv run --no-sync pytest -q
          uv run --no-sync ruff check arpticuno tests
          uv run --no-sync mypy arpticuno
          uv run --no-sync bandit -q -r arpticuno
          uv run --no-sync pip-audit --local --skip-editable

      - name: Build distributions and SBOM
        run: |
          uv build --no-sources
          uv run --no-sync pip-audit --local --skip-editable --format cyclonedx-json --output dist/sbom.cdx.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
