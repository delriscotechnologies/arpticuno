name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Windows / Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and checks
        run: |
          python -m pip install --disable-pip-version-check --upgrade "setuptools>=83"
          python -m pip install --disable-pip-version-check ".[dev]"
      - name: Enforce source limit
        shell: bash
        run: |
          lines="$(wc -l arpticuno/*.py | tail -n 1 | awk '{print $1}')"
          test "$lines" -le 400
      - name: Static checks
        run: |
          python -m ruff check arpticuno
          python -m mypy arpticuno
          python -m bandit -q -r arpticuno
          python -m compileall -q arpticuno
      - name: Dependency audit
        run: python -m pip_audit
      - name: Package build
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Network-free smoke checks
        shell: bash
        run: |
          python -c "import sys; assert sys.platform == 'win32'"
          python -c "import ctypes; assert ctypes.WinDLL('iphlpapi').SendARP"
          arpticuno --version
          diff --strip-trailing-cr <(awk '/^```text$/{capture=1; next} capture && /^```$/{exit} capture{print}' README.md) <(python -m arpticuno.sandbox)
          python -m arpticuno.sandbox --format json | python -m json.tool >/dev/null
          python -m arpticuno.sandbox --format csv >/dev/null
          if arpticuno scan 8.8.8.8 --ports 53 --no-banner; then exit 1; fi
