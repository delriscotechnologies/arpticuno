name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Verify uv version
        run: |
          case "$(uv --version)" in
            "uv 0.11.29"*) ;;
            *) exit 1 ;;
          esac

      - name: Install the locked environment
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Run complete test discovery
        run: uv run --no-sync pytest -q

      - name: Run Ruff
        run: uv run --no-sync ruff check arpticuno tests

      - name: Run mypy
        run: uv run --no-sync mypy arpticuno

      - name: Run Bandit
        run: uv run --no-sync bandit -q -r arpticuno

      - name: Run dependency audit
        run: uv run --no-sync pip-audit --local --skip-editable
