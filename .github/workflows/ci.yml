name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Verify uv version
        run: |
          case "$(uv --version)" in
            "uv 0.11.29"*) ;;
            *) exit 1 ;;
          esac

      - name: Install the locked environment
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Run complete test discovery
        run: uv run --no-sync pytest -q

      - name: Run Ruff
        run: uv run --no-sync ruff check arpticuno tests

      - name: Run mypy
        run: uv run --no-sync mypy arpticuno

      - name: Run Bandit
        run: uv run --no-sync bandit -q -r arpticuno

      - name: Run dependency audit
        run: uv run --no-sync pip-audit --local --skip-editable
