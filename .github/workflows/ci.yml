name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.10.11

      - name: Install the locked environment
        run: uv sync --locked --all-extras --python "${{ matrix.python-version }}"

      - name: Run tests
        run: uv run --no-sync pytest -q

      - name: Run lint and type checks
        run: |
          uv run --no-sync ruff check arpticuno tests
          uv run --no-sync mypy arpticuno

      - name: Run security checks
        run: |
          uv run --no-sync bandit -q -r arpticuno
          uv run --no-sync pip-audit --local --skip-editable

