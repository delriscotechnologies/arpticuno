name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test-files:
          - "tests/test_discovery.py tests/test_appsec_hardening.py"
          - "tests/test_discovery.py tests/test_sandbox.py"
          - "tests/test_appsec_hardening.py tests/test_sandbox.py"
          - "tests/test_discovery.py tests/test_appsec_hardening.py tests/test_sandbox.py"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"

      - name: Install the locked environment
        run: uv sync --locked --all-extras --python 3.12

      - name: Run portable and selected Linux tests
        run: >-
          uv run --no-sync pytest -q
          tests/test_cli.py
          tests/test_ports.py
          tests/test_reporting.py
          tests/test_maturity.py
          ${{ matrix.test-files }}
