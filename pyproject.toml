[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "arpticuno"
version = "0.3.0"
description = "Windows IPv4 LAN neighbor discovery and TCP connect scanner for authorized environments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cristian Del Risco" }
]
classifiers = ["Operating System :: Microsoft :: Windows"]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff==0.16.4",
  "mypy==2.3.1",
  "bandit==1.9.4",
  "pip-audit==2.10.1"
]

[project.urls]
Homepage = "https://github.com/delriscotechnologies/arpticuno"
Repository = "https://github.com/delriscotechnologies/arpticuno"
Issues = "https://github.com/delriscotechnologies/arpticuno/issues"

[project.scripts]
arpticuno = "arpticuno.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arpticuno"]
