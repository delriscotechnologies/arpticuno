[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[project]
name = "arpticuno"
version = "0.1.0"
description = "Basic IPv4 LAN ARP discovery and TCP connect scanner for authorized environments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Cristian Del Risco" }
]
dependencies = [
  "scapy==2.7.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.21",
  "mypy==2.3.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1"
]

[project.scripts]
arpticuno = "arpticuno.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
