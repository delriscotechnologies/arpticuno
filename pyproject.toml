[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arpticuno"
version = "0.1.0"
description = "Focused IPv4 LAN ARP discovery and TCP connect scanner for authorized environments."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Cristian Del Risco" }
]
dependencies = [
  "scapy==2.7.0"
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.2",
  "mypy==2.3.0",
  "bandit==1.9.4",
  "pip-audit==2.10.1"
]

[project.urls]
Homepage = "https://github.com/delriscotechnologies/arpticuno"
Repository = "https://github.com/delriscotechnologies/arpticuno"
Issues = "https://github.com/delriscotechnologies/arpticuno/issues"

[project.scripts]
arpticuno = "arpticuno.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["arpticuno"]
